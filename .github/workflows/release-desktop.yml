name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z or vX.Y.Z-prerelease tag to package
        required: true
        type: string
      release_type:
        description: GitHub release visibility
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
      confirm_publish:
        description: I approve uploading artifacts to a draft/prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  validate-release:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::release_tag must match vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify exact release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$TAG_REF"; then
            echo "::error::$TAG_REF does not exist"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::$TAG_REF does not resolve to checked-out HEAD"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match desktop package version $PACKAGE_VERSION"
            exit 1
          fi

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact release tag and package version
        shell: bash
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$TAG_REF"; then
            echo "::error::$TAG_REF does not exist"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::$TAG_REF does not resolve to checked-out HEAD"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match desktop package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Validate Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $missing = $false
          foreach ($name in @("WINDOWS_CSC_LINK", "WINDOWS_CSC_KEY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "::error::$name is not configured"
              $missing = $true
            }
          }
          if ($missing) {
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          # Cross-repo private package read (@kentzu213/graph-view in izzi-web).
          # PAT wins if set; else automatic token + `permissions: packages: read`
          # works when this repo is granted read access to the package.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build desktop app
        run: pnpm build

      - name: Run desktop tests
        run: pnpm test

      - name: Package and Upload Draft
        run: npx electron-builder --win --config electron-builder.json --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: ${{ inputs.release_type == 'draft' }}
          EP_PRE_RELEASE: ${{ inputs.release_type == 'prerelease' }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

  build-mac:
    runs-on: macos-latest
    # Run AFTER build-windows (not in parallel) so only one job creates the
    # GitHub release; this one then uploads the mac assets to the existing
    # release. Prevents the "422 already_exists" race when both jobs publish.
    needs: build-windows
    environment: desktop-release
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact release tag and package version
        shell: bash
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$TAG_REF"; then
            echo "::error::$TAG_REF does not exist"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::$TAG_REF does not resolve to checked-out HEAD"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match desktop package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          # Cross-repo private package read (@kentzu213/graph-view in izzi-web).
          # PAT wins if set; else automatic token + `permissions: packages: read`
          # works when this repo is granted read access to the package.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build desktop app
        run: pnpm build

      - name: Validate macOS signing and notarization secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Package and Upload Draft
        run: npx electron-builder --mac --config electron-builder.json --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: ${{ inputs.release_type == 'draft' }}
          EP_PRE_RELEASE: ${{ inputs.release_type == 'prerelease' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
