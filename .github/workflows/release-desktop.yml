name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Run GitHub Actions runtime contract
        run: pnpm test:actions
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          # Cross-repo private package read (@kentzu213/graph-view in izzi-web).
          # PAT wins if set; else automatic token + `permissions: packages: read`
          # works when this repo is granted read access to the package.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run workspace lint
        run: pnpm lint
        working-directory: .

      - name: Run ESLint config contract tests
        run: pnpm test:lint-config
        working-directory: .

      - name: Build desktop app
        run: pnpm build

      - name: Enforce renderer bundle budget
        run: pnpm test:renderer-budget
        working-directory: .

      - name: Run desktop tests
        run: pnpm test

      - name: Run Socrates vendored-integrity tests
        run: pnpm test:socrates
        working-directory: .

      - name: Package Windows
        run: npx electron-builder --win --config electron-builder.json --publish never

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $tag is already published; refusing to replace its assets."
            }
            if ($release.isPrerelease -ne $tag.Contains('-')) {
              throw "Draft release $tag has the wrong prerelease state."
            }
          } else {
            $title = $tag -replace '^v', ''
            $arguments = @(
              'release', 'create', $tag,
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag',
              '--draft',
              '--title', $title,
              '--notes', "Automated Izzi AI desktop release $title."
            )
            if ($tag.Contains('-')) {
              $arguments += '--prerelease'
            } else {
              $arguments += '--latest'
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create GitHub release $tag."
            }
          }

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            (Resolve-Path "release/Izzi-AI-$version-win-x64.exe").Path,
            (Resolve-Path "release/Izzi-AI-$version-win-x64.exe.blockmap").Path,
            (Resolve-Path 'release/latest.yml').Path
          )
          & gh release upload $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to upload the Windows release assets.'
          }

  build-mac:
    runs-on: macos-latest
    # Windows creates the draft and uploads its assets first. macOS extends the
    # same draft; the final job publishes only after all 12 assets are verified.
    needs: build-windows
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Provision macOS native architectures
        run: >-
          npm pkg set --json
          'pnpm.supportedArchitectures.os=["darwin"]'
          'pnpm.supportedArchitectures.cpu=["x64","arm64"]'
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          # Cross-repo private package read (@kentzu213/graph-view in izzi-web).
          # PAT wins if set; else automatic token + `permissions: packages: read`
          # works when this repo is granted read access to the package.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build desktop app
        run: pnpm build

      - name: Package macOS
        run: npx electron-builder --mac --config electron-builder.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "release/Izzi-AI-${version}-mac-x64.dmg"
            "release/Izzi-AI-${version}-mac-x64.dmg.blockmap"
            "release/Izzi-AI-${version}-mac-x64.zip"
            "release/Izzi-AI-${version}-mac-x64.zip.blockmap"
            "release/Izzi-AI-${version}-mac-arm64.dmg"
            "release/Izzi-AI-${version}-mac-arm64.dmg.blockmap"
            "release/Izzi-AI-${version}-mac-arm64.zip"
            "release/Izzi-AI-${version}-mac-arm64.zip.blockmap"
            "release/latest-mac.yml"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  verify-and-publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    steps:
      - name: Verify complete release inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $requiredNames = @(
            "Izzi-AI-$version-win-x64.exe",
            "Izzi-AI-$version-win-x64.exe.blockmap",
            'latest.yml',
            "Izzi-AI-$version-mac-x64.dmg",
            "Izzi-AI-$version-mac-x64.dmg.blockmap",
            "Izzi-AI-$version-mac-x64.zip",
            "Izzi-AI-$version-mac-x64.zip.blockmap",
            "Izzi-AI-$version-mac-arm64.dmg",
            "Izzi-AI-$version-mac-arm64.dmg.blockmap",
            "Izzi-AI-$version-mac-arm64.zip",
            "Izzi-AI-$version-mac-arm64.zip.blockmap",
            'latest-mac.yml'
          )
          $release = gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw 'Release must remain a draft until the inventory is complete.'
          }
          if ($release.isPrerelease -ne $env:GITHUB_REF_NAME.Contains('-')) {
            throw 'Release prerelease state does not match the tag.'
          }
          $assets = @($release.assets)
          foreach ($name in $requiredNames) {
            $asset = $assets | Where-Object name -eq $name
            if (-not $asset) {
              throw "Missing release asset: $name"
            }
            if ($asset.size -le 0) {
              throw "Release asset is empty: $name"
            }
            if ($asset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "Release asset has no valid SHA-256 digest: $name"
            }
          }
          if ($assets.Count -ne $requiredNames.Count) {
            $unexpected = $assets.name | Where-Object { $_ -notin $requiredNames }
            throw "Unexpected release inventory: $($unexpected -join ', ')"
          }
          & gh release edit $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to publish the verified desktop release.'
          }
          $published = gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets | ConvertFrom-Json
          $expectedPrerelease = $env:GITHUB_REF_NAME.Contains('-')
          $publishedAssetCount = @($published.assets).Count
          if ($published.isDraft -or ($published.isPrerelease -ne $expectedPrerelease) -or ($publishedAssetCount -ne $requiredNames.Count)) {
            throw 'Published release state does not match the verified draft.'
          }
