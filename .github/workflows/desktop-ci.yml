name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  desktop-ci:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Run GitHub Actions runtime contract
        run: pnpm test:actions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Cross-repo private package read (@kentzu213/graph-view lives in izzi-web).
          # Two supported auth paths (either one works, PAT wins if set):
          #  1) Grant this repo read access to the package (package settings ->
          #     Manage Actions access) — then the automatic GITHUB_TOKEN below works
          #     with `permissions: packages: read`. No secret to store/rotate.
          #  2) Add a classic PAT (read:packages) as secret GH_PACKAGES_TOKEN.
          # Consumed by root .npmrc (${NODE_AUTH_TOKEN}).
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run workspace lint
        run: pnpm lint

      - name: Run ESLint config contract tests
        run: pnpm test:lint-config

      - name: Build workspace
        run: pnpm build:all

      - name: Enforce renderer bundle budget
        run: pnpm test:renderer-budget

      - name: Run desktop smoke tests
        run: pnpm --filter @openclaw/desktop test

      - name: Run Socrates vendored-integrity tests
        run: pnpm test:socrates
