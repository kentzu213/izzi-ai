name: Publish Voice TTS Image

# On-demand publisher for the image the Voice Studio extension's local backend
# profile pulls — izzi-voice-tts (FastAPI + VieNeu-TTS). Manual trigger so it
# never races the desktop release pipeline.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (in addition to sha-<commit>)'
        required: false
        default: 'candidate'

permissions:
  contents: read

jobs:
  publish:
    name: Build & push izzi-voice-tts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The repository contains a deliberately URL-less private gitlink. The
      # stock checkout action always probes submodules during auth cleanup, even
      # with submodules:false, and therefore fails before the build starts.
      - name: Checkout source without submodules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_SHA"
          unset auth GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Lowercase registry owner
        id: owner
        run: echo "lc=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: image_metadata
        shell: bash
        run: |
          backend_root='extensions/voice-studio/service/backend'
          backend_tree_sha256="$(
            git ls-files -z "$backend_root" \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          )"
          echo "backend_tree_sha256=$backend_tree_sha256" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch so it runs on Windows (amd64) and Apple Silicon (arm64) machines.
      # provenance:false keeps a plain manifest list that `docker compose pull` on
      # user machines handles most reliably.
      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: extensions/voice-studio/service/backend
          file: extensions/voice-studio/service/backend/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BACKEND_TREE_SHA256=${{ steps.image_metadata.outputs.backend_tree_sha256 }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/izzi-voice-tts:${{ inputs.tag }}
            ghcr.io/${{ steps.owner.outputs.lc }}/izzi-voice-tts:sha-${{ github.sha }}
